[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opsmind"
version = "0.1.0"
description = "A production-shaped synthetic manufacturing IT operations agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph>=1.2.11",
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opsmind"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
markers = [
    "live: opt-in tests that call a real external model API",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
